[project]
name = "crudkit-sign"
version = "0.1.0"
description = "E-signature addon for crudkit: sign any crudkit model's PDF with a DocuSign-like flow."
readme = "README.md"
license = "MIT"
authors = [{ name = "Plecto ApS" }]
requires-python = ">=3.12"
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 5.1",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "crudkit[api]>=0.6.0",
    "celery>=5.3",
    "Django>=5.1",
    "Pillow>=10.0",
    "pypdf>=5.0",
    "pdfplumber>=0.11",
    "reportlab>=4.0",
]

[project.urls]
Homepage = "https://github.com/plecto/crudkit-sign"
Repository = "https://github.com/plecto/crudkit-sign"
Issues = "https://github.com/plecto/crudkit-sign/issues"

[dependency-groups]
dev = ["ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crudkit_sign"]

[tool.ruff]
line-length = 120
extend-exclude = ["migrations"]

[tool.ruff.lint]
ignore = ["RUF012"]
