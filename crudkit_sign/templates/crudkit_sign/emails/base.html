<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{ title }}</title>
</head>
<body style="margin: 0; padding: 0; background: #f3f4f6; -webkit-text-size-adjust: 100%;">
<div style="display: none; max-height: 0; overflow: hidden; mso-hide: all;">{% block preheader %}{% endblock %}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background: #f3f4f6;">
<tr><td align="center" style="padding: 32px 16px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width: 560px; font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; color: #1f2937;">
  <tr><td style="background: #ffffff; border: 1px solid #e5e7eb; border-radius: 8px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
      {% if logo_url or brand_name %}
      <tr><td style="padding: 20px 32px; border-bottom: 1px solid #e5e7eb;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
          {% if logo_url %}<td style="padding-right: 10px; vertical-align: middle;"><img src="{{ logo_url }}" width="32" height="32" alt="" style="display: block; border: 0;"></td>{% endif %}
          {% if brand_name %}<td style="vertical-align: middle; font-size: 17px; font-weight: 600; color: #111827;">{{ brand_name }}</td>{% endif %}
        </tr></table>
      </td></tr>
      {% endif %}
      <tr><td style="padding: 32px; font-size: 15px; line-height: 1.6;">
        {% block content %}{% endblock %}
      </td></tr>
    </table>
  </td></tr>
  <tr><td style="padding: 20px 32px; font-size: 12px; line-height: 1.5; color: #6b7280; text-align: center;">
    {% block footer %}{% if brand_name %}Sent by {{ brand_name }}.{% endif %}{% endblock %}
  </td></tr>
</table>
</td></tr>
</table>
</body>
</html>
